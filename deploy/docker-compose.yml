# Self-hosted dev/staging deployment - gives a frontend developer a publicly-reachable
# API to build against. NOT BGaming's submission pipeline (that's just `docker build` +
# `docker image push` against project/backend's own Dockerfile directly - see that file's
# header comment); this compose file is purely our own infrastructure, never seen by
# BGaming. See deploy/README.md for the full explanation and setup steps, including which
# parts of this file are unverified assumptions about runner_cli's behavior.
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  backend:
    build:
      context: ..
      dockerfile: project/backend/Dockerfile
    environment:
      ENABLE_GOD_MODE: "1"
      # Runner uses host networking (see below), so its RNG service is reachable on the
      # host at 127.0.0.1:4002. host.docker.internal resolves to the host gateway from
      # inside a bridge-networked container.
      RNG_URL: "http://host.docker.internal:4002/api"
    extra_hosts:
      - "host.docker.internal:host-gateway" # makes host.docker.internal resolve on Linux
    ports:
      - "127.0.0.1:4051:80" # localhost-only - runner reaches backend here, never public
    restart: unless-stopped

  runner:
    build:
      context: ..
      dockerfile: deploy/runner.Dockerfile
    network_mode: host # bypasses Docker DNS entirely - runner uses host network stack,
                       # reaching backend at 127.0.0.1:4051 and binding 4000/4001/4002
                       # directly on the host (nginx already proxies host:4001 to public)
    depends_on:
      - backend
    restart: unless-stopped
